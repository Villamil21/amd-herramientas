[package]
name = "amd-herramientas"
version = "1.19.1"
description = "Herramientas administrativas y contables"
edition = "2021"
publish = false

[lib]
name = "amd_herramientas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite del sistema (macOS lo incluye): evita compilar y empaquetar otra copia.
rusqlite = { version = "0.40" }
calamine = { version = "0.36", default-features = false }
base64 = "0.22"
getrandom = "0.3"
# Decodificación completa de firmas PNG (rechaza archivos renombrados o dañados).
png = "0.17"
# Escritura de .xlsx (exportación de análisis de extractos).
rust_xlsxwriter = { version = "0.99", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
